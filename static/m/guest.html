<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8"><link rel="icon" href="data:,"><title>访客登记借用</title>
<link rel="stylesheet" href="/m/m.css">
<style>
.g-h{padding:26px 10px 14px}.g-h h1{font-size:23px;font-weight:700}.g-h .d{color:var(--tx3);font-size:13.5px;margin-top:4px}
.req{color:var(--bad,#d93026)}
.sig{width:100%;height:160px;border-radius:12px;background:#f5f6f8;touch-action:none;display:block}
.sigbar{display:flex;justify-content:space-between;font-size:13px;color:var(--tx3);margin-top:6px}
.g-err{position:fixed;left:16px;right:16px;bottom:90px;background:#d93026;color:#fff;border-radius:12px;padding:12px 14px;z-index:50;font-size:14.5px}
.ln select{margin-top:4px;border:1px solid var(--line);border-radius:8px;background:#fff;height:30px;font-size:13.5px}
.x{border:0;background:none;color:var(--tx3);font-size:20px;width:30px}
/* v1.1.1：大按钮、快速选 */
.g-big button{height:46px;padding:0 18px;border-radius:23px;font-size:15.5px}
.g-picks .pick{min-height:60px;font-size:15px}
.g-pu{position:relative;padding-right:34px}.g-pux{position:absolute;right:0;bottom:6px;height:40px}
.g-add{width:100%;margin-top:12px;background:#f5f6f8;color:var(--ac)}
.g-more{width:100%;height:44px;border:0;background:none;display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--tx2);padding:0 2px}
.bar .sum small{max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.ok-big{text-align:center;padding:60px 24px}.ok-big .c{width:72px;height:72px;border-radius:50%;background:var(--ac);color:#fff;font-size:38px;line-height:72px;margin:0 auto 16px}
</style></head>
<body class="m"><div id="app"><div class="empty" style="padding:60px 20px;text-align:center">正在打开…</div></div>
<script src="/names.js"></script><script src="/m/guest.js"></script></body></html>
